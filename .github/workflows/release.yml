# Publishes to npm when a version tag is pushed:
#
#   (bump version in package.json, add the release to CHANGELOG.md, merge)
#   git tag v0.1.1 && git push --tags
#
# Tag right after the merge that bumps the version, on main: a tag on a commit
# that is not on main is refused here, and CI refuses a PR that bumps the
# version again while the one on main is not yet on npm (ci.yml).
#
# Auth: npm trusted publishing (OIDC) — no token stored in the repository. On
# npmjs.com → @amenophis1er/byok → Settings → Trusted publisher: repository
# amenophis1er/byok, workflow release.yml. Published with a provenance
# attestation tying the release to this commit and workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag on a branch, pushed before its PR is merged, would publish unreviewed-by-main code:
      # only a commit reachable from main is released.
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is on main"
          else
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge first, then tag main: git tag $GITHUB_REF_NAME <main sha> -f && git push origin $GITHUB_REF_NAME -f"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::Tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      # prepublishOnly runs the full check (typecheck, tests, build, API report).
      # Provenance is signed here, in CI; a publish from a laptop cannot sign it.
      - run: npm publish --provenance
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
