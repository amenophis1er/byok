# Publishes to npm when a version tag is pushed:
#
#   (bump version in package.json, add the release to CHANGELOG.md, merge)
#   git tag v0.1.1 && git push --tags
#
# Auth: npm trusted publishing (OIDC) — no token stored in the repository. On
# npmjs.com → @amenophis1er/byok → Settings → Trusted publisher: repository
# amenophis1er/byok, workflow release.yml. Published with a provenance
# attestation tying the release to this commit and workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::Tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      # prepublishOnly runs the full check (typecheck, tests, build, API report).
      - run: npm publish
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
